name: Atualizar dados e publicar

on:
  # todo dia às 09:17 UTC (06:17 em Brasília) — pega os eventos de sábado já no domingo/segunda
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  # em qualquer push o build é validado; o deploy só acontece na branch padrão
  push:

concurrency:
  group: publicar
  cancel-in-progress: true

# contents: gravar o arquivo de linhas de mercado; os demais são usados pela ação de deploy
permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # usado só para decidir se o deploy roda (sem o segredo, o workflow só valida o build)
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # caches das buscas de fotos (ESPN/Wikidata) entre execuções
      - uses: actions/cache@v4
        with:
          path: |
            data/raw/cache-*.json
            data/raw/espn-headshots.json
            data/raw/wikipedia-ufc-rankings.txt
            data/raw/espn-sb-*.json
            data/raw/wikidata-photos.json
          key: dados-cache-${{ github.run_id }}
          restore-keys: dados-cache-

      - name: Gerar dados (UFCStats)
        run: npm run data

      # a ESPN retira as linhas depois da luta (e os scorecards são coletados aos poucos): o que foi coletado fica guardado no repositório
      - name: Guardar linhas de mercado
        if: ${{ github.ref_name == github.event.repository.default_branch }}
        run: |
          if [ -n "$(git status --porcelain data/odds data/scorecards)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/odds data/scorecards
            git commit -m "Atualiza arquivos de mercado e scorecards"
            git push || echo "::warning::Não foi possível gravar o arquivo de mercado agora; a próxima execução tenta de novo."
          fi

      - name: Build do site
        run: npm run build

      - name: Publicar no Firebase Hosting
        if: ${{ env.HAS_FIREBASE == 'true' && github.ref_name == github.event.repository.default_branch }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
